
name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar instalador
        run: npm run dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Pedidos-Pro-Instalador-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
